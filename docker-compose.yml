# Postgres 18 + pgvector 0.8.6 (Debian Trixie).
# Credentials and tunables use ${VAR:-default} — override in `.env` without editing this file.
# PG 18 stores data under /var/lib/postgresql (not /var/lib/postgresql/data).
# Init scripts in docker/postgres/init run only on an empty data volume.

name: python-ai

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      # Bind localhost only. Set POSTGRES_BIND=0.0.0.0 to listen on all interfaces.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    environment:
      # Required. Image default user is "postgres" if unset — we pin app-owned defaults.
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}

      # First boot only (empty volume). Checksums catch silent storage corruption.
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8 --locale=C.UTF-8 --data-checksums}

      # Default is scram-sha-256. Do not set this to "trust".
      # POSTGRES_HOST_AUTH_METHOD: scram-sha-256

      TZ: ${TZ:-UTC}
      PGTZ: ${PGTZ:-UTC}

    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    # Docker default /dev/shm is 64MB. HNSW index builds need more (match maintenance_work_mem).
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}

    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
    name: python-ai-pg18
